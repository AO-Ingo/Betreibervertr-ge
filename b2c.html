<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>AMBA Vertragsgenerator – B2C</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 60px 20px 40px;
      color: #1a1a2e;
    }

    .back-link {
      position: fixed;
      top: 14px;
      left: 16px;
      z-index: 999;
      text-decoration: none;
      font-size: 13px;
      color: #0057b8;
      font-weight: 600;
      opacity: 0.8;
    }
    .back-link:hover { opacity: 1; }

    h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 32px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 28px 32px;
      max-width: 700px;
      margin: 0 auto 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .card h2 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #0057b8;
      margin-bottom: 18px;
    }

    .field-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .field-group.single { grid-template-columns: 1fr; }
    .field-group.triple { grid-template-columns: 1fr 1fr 1fr; }

    label {
      display: flex;
      flex-direction: column;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      gap: 5px;
    }
    label span.required { color: #e53935; }

    input, select {
      padding: 9px 12px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      color: #1a1a2e;
      background: #fff;
      transition: border-color 0.15s;
      width: 100%;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #0057b8;
    }
    input[readonly] {
      background: #f7f8fa;
      color: #555;
    }

    .profile-select-wrap {
      max-width: 700px;
      margin: 0 auto 20px;
    }
    .profile-select-wrap select {
      font-size: 15px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 2px solid #0057b8;
      font-weight: 600;
      color: #0057b8;
      background: #fff;
      cursor: pointer;
    }

    .info-box {
      background: #f0f6ff;
      border-left: 3px solid #0057b8;
      border-radius: 0 8px 8px 0;
      padding: 10px 14px;
      font-size: 13px;
      color: #444;
      margin-bottom: 18px;
    }
    .info-box strong { color: #0057b8; }

    .btn-generate {
      display: block;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 15px;
      background: #0057b8;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-generate:hover { background: #004499; transform: translateY(-1px); }
    .btn-generate:active { transform: none; }
    .btn-generate:disabled { background: #aaa; cursor: not-allowed; transform: none; }

    .status {
      max-width: 700px;
      margin: 14px auto 0;
      font-size: 13px;
      text-align: center;
      color: #555;
      min-height: 20px;
    }
    .status.error { color: #e53935; }
    .status.success { color: #2e7d32; }

    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 18px 0;
    }

    /* Ladeeinrichtungen */
    .le-row {
      display: grid;
      grid-template-columns: 2fr 2fr 1fr;
      gap: 10px;
      align-items: end;
      margin-bottom: 10px;
    }
    .btn-add-le {
      background: none;
      border: 1.5px dashed #0057b8;
      color: #0057b8;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-add-le:hover { background: #f0f6ff; }
    .btn-remove-le {
      background: none;
      border: none;
      color: #e53935;
      font-size: 18px;
      cursor: pointer;
      padding: 0 6px;
      line-height: 1;
      align-self: center;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

<a class="back-link" href="index.html">← Übersicht</a>

<h1>Betreiberverträge B2C</h1>
<p class="subtitle">Kundenprofil auswählen — Felder werden automatisch befüllt</p>

<!-- Profil-Auswahl -->
<div class="profile-select-wrap">
  <select id="profileSelect" onchange="applyProfile()">
    <option value="">— Kundenprofil auswählen —</option>
    <option value="lerners">Lerner'sches Schloss</option>
    <option value="gwg">GWG Seepark</option>
    <option value="lbbw">LBBW Park Trio</option>
    <option value="nio" disabled>Nio Project / Premium Immo (Vorlage ausstehend)</option>
    <option value="gsw">GSW Reutlingen</option>
  </select>
</div>

<!-- Info-Box (wird bei Profilwahl befüllt) -->
<div class="info-box" id="infoBox" style="display:none; max-width:700px; margin: 0 auto 20px;"></div>

<!-- Auftraggeber -->
<div class="card">
  <h2>Auftraggeber</h2>
  <div class="field-group" style="grid-template-columns:1fr 1fr; margin-bottom:14px;">
    <label>Vorname <span class="required">*</span><input type="text" id="vorname" placeholder="Max"></label>
    <label>Nachname <span class="required">*</span><input type="text" id="nachname" placeholder="Mustermann"></label>
  </div>
  <div class="field-group single" style="margin-bottom:14px;">
    <label>Straße &amp; Hausnummer<input type="text" id="strasse" placeholder="Musterstraße 1"></label>
  </div>
  <div class="field-group" style="margin-bottom:14px;">
    <label>PLZ<input type="text" id="plz" placeholder="12345"></label>
    <label>Stadt<input type="text" id="stadt" placeholder="Musterstadt"></label>
  </div>
  <hr class="divider">
  <div class="field-group">
    <label>Stellplatz / Einheit<input type="text" id="stellplatz" placeholder="z.B. Tiefgarage B12"></label>
    <label>Vertragsdatum<input type="date" id="datum"></label>
  </div>
</div>

<!-- Standort -->
<div class="card">
  <h2>Standort &amp; Ladeeinrichtung</h2>
  <div class="field-group single" style="margin-bottom:14px;">
    <label>Standortbezeichnung<input type="text" id="standortName" placeholder="wird durch Profil befüllt" readonly></label>
  </div>
  <div class="field-group single" style="margin-bottom:14px;">
    <label>Standortadresse<input type="text" id="standortAdresse" placeholder="wird durch Profil befüllt" readonly></label>
  </div>
  <hr class="divider">
  <div id="leContainer"></div>
  <button class="btn-add-le" onclick="addLadeeinrichtung()">+ Ladeeinrichtung hinzufügen</button>
</div>

<!-- Vertragsdaten -->
<div class="card">
  <h2>Vertragsdaten</h2>
  <div class="field-group">
    <label>Artikel (Zoho)<input type="text" id="zohoArtikelName" readonly></label>
    <label>Artikel-ID<input type="text" id="zohoArtikelId" readonly></label>
  </div>
  <div id="zusatzArtikelWrap" style="display:none; margin-top:14px;">
    <hr class="divider">
    <div class="field-group">
      <label>Zusatzartikel<input type="text" id="zohoZusatzName" readonly></label>
      <label>Zusatz-ID<input type="text" id="zohoZusatzId" readonly></label>
    </div>
  </div>
</div>

<button class="btn-generate" id="btnGenerate" onclick="generate()" disabled>
  Vertrag generieren &amp; Angebot erstellen
</button>
<div class="status" id="status"></div>

<script>
// ============================================================
// PROFILE CONFIGURATION — leicht erweiterbar
// ============================================================
const PROFILES = {
  lerners: {
    label: "Lerner'sches Schloss",
    standortName: '',           // TODO: nach Vertragsaufarbeitung befüllen
    standortAdresse: '',        // TODO
    geraet: '',                 // TODO
    docxUrl: '',                // TODO: Vorlage hochladen und URL eintragen
    zohoArtikelId: '520234000000111321',
    zohoArtikelName: 'Vollbetrieb - ganzheitlicher Betrieb der Ladestation',
    zusatzId: '520234000000488013',
    zusatzName: 'Inbetriebnahme Backend',
    preis: '240 € / Jahr',
  },
  gwg: {
    label: 'GWG Seepark',
    standortName: '',           // TODO
    standortAdresse: '',        // TODO
    geraet: '',                 // TODO
    docxUrl: '',                // TODO
    zohoArtikelId: '520234000003573017',
    zohoArtikelName: 'Vollbetrieb - ganzheitlicher Betrieb der Ladestation (AMBA/reev living)',
    zusatzId: null,
    zusatzName: null,
    preis: '13,87 € / Monat',
  },
  lbbw: {
    label: 'LBBW Park Trio',
    standortName: 'LBBW Park Trio',
    standortAdresse: 'Felix Kracht Straße 24, 60486 Frankfurt am Main',
    geraet: 'ABL eM4',
    docxUrl: 'https://raw.githubusercontent.com/AO-Ingo/Autofill_LBBW-Park-Trio_Betriebervertrag/main/Betreibervertrag_LBBW_Park_Trio_Vorlage.docx',
    zohoArtikelId: '520234000003732039',
    zohoArtikelName: 'Vollbetrieb - ganzheitlicher Betrieb der Ladestation LBBW Park Trio',
    zusatzId: null,
    zusatzName: null,
    preis: '',
  },
  nio: {
    label: 'Nio Project / Premium Immo',
    standortName: '',
    standortAdresse: '',
    geraet: '',
    docxUrl: '',                // TODO: Vorlage hochladen
    zohoArtikelId: '520234000003658062',
    zohoArtikelName: 'Operative Betriebsführung (NIO)',
    zusatzId: null,
    zusatzName: null,
    preis: '10 € / Monat',
  },
  gsw: {
    label: 'GSW Reutlingen',
    standortName: 'GSW Reutlingen',
    standortAdresse: 'Ludwigstrasse 17, 72766 Reutlingen',
    geraet: 'Hager',
    docxUrl: 'https://raw.githubusercontent.com/AO-Ingo/Autofill_GSW-Reutlingen/main/Betreibervertrag_AO_Strom_GSW_Reutlingen_Vorlage.docx',
    zohoArtikelId: '520234000003815062',
    zohoArtikelName: 'Vollbetrieb - ganzheitlicher Betrieb der Ladestation GSW Reutlingen',
    zusatzId: null,
    zusatzName: null,
    preis: '262 € / Jahr',
  },
};

const WEBHOOK = 'https://hook.eu2.make.com/bxt8ju15xwttjyphu3ubb1jdff6xlh4w';

let currentProfile = null;

// ============================================================
// PROFIL ANWENDEN
// ============================================================
function applyProfile() {
  const key = document.getElementById('profileSelect').value;
  if (!key) {
    currentProfile = null;
    document.getElementById('infoBox').style.display = 'none';
    document.getElementById('btnGenerate').disabled = true;
    clearProfileFields();
    return;
  }

  const p = PROFILES[key];
  currentProfile = { key, ...p };

  // Standort
  document.getElementById('standortName').value = p.standortName;
  document.getElementById('standortAdresse').value = p.standortAdresse;

  // Artikel
  document.getElementById('zohoArtikelId').value = p.zohoArtikelId;
  document.getElementById('zohoArtikelName').value = p.zohoArtikelName;

  // Zusatzartikel
  const zusatzWrap = document.getElementById('zusatzArtikelWrap');
  if (p.zusatzId) {
    document.getElementById('zohoZusatzId').value = p.zusatzId;
    document.getElementById('zohoZusatzName').value = p.zusatzName;
    zusatzWrap.style.display = '';
  } else {
    zusatzWrap.style.display = 'none';
  }

  // Ladeeinrichtungen zurücksetzen und default hinzufügen
  document.getElementById('leContainer').innerHTML = '';
  addLadeeinrichtung(p.geraet);

  // Info-Box
  const infoBox = document.getElementById('infoBox');
  let info = `<strong>${p.label}</strong>`;
  if (p.preis) info += ` &nbsp;·&nbsp; ${p.preis}`;
  if (!p.docxUrl) info += ` &nbsp;·&nbsp; ⚠️ DOCX-Vorlage noch nicht hinterlegt`;
  infoBox.innerHTML = info;
  infoBox.style.display = '';

  // Button aktivieren (nur wenn DOCX vorhanden)
  document.getElementById('btnGenerate').disabled = !p.docxUrl;

  // Datum heute vorausfüllen
  if (!document.getElementById('datum').value) {
    document.getElementById('datum').value = new Date().toISOString().split('T')[0];
  }
}

function clearProfileFields() {
  ['standortName','standortAdresse','zohoArtikelId','zohoArtikelName','zohoZusatzId','zohoZusatzName'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('leContainer').innerHTML = '';
}

// ============================================================
// LADEEINRICHTUNGEN
// ============================================================
let leCount = 0;

function addLadeeinrichtung(defaultGeraet = '') {
  leCount++;
  const id = leCount;
  const row = document.createElement('div');
  row.className = 'le-row';
  row.id = `le-${id}`;
  row.innerHTML = `
    <label>Gerät / Typ
      <input type="text" id="le-geraet-${id}" value="${defaultGeraet}" placeholder="z.B. ABL eM4">
    </label>
    <label>Seriennummer
      <input type="text" id="le-serial-${id}" placeholder="SN-XXXXXX">
    </label>
    <button class="btn-remove-le" onclick="removeLadeeinrichtung(${id})" title="Entfernen">×</button>
  `;
  document.getElementById('leContainer').appendChild(row);
}

function removeLadeeinrichtung(id) {
  const el = document.getElementById(`le-${id}`);
  if (el) el.remove();
}

// ============================================================
// PLACEHOLDER REPLACE (split-XML-safe)
// ============================================================
function replaceTag(xml, tag, value) {
  const safe = String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // First try direct replacement
  const direct = `{{${tag}}}`;
  if (xml.includes(direct)) {
    return xml.split(direct).join(safe);
  }
  // Split-run repair: find the placeholder spread across runs
  const parts = `{{${tag}}}`.split('');
  const tagPattern = new RegExp(
    parts.map(c => `(?:<[^>]+>)*${c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}(?:<[^>]+>)*`).join(''),
    'g'
  );
  return xml.replace(tagPattern, match => {
    // Extract run properties from first run
    const rPrMatch = match.match(/<w:rPr>[\s\S]*?<\/w:rPr>/);
    const rPr = rPrMatch ? rPrMatch[0] : '';
    return `<w:r>${rPr}<w:t>${safe}</w:t></w:r>`;
  });
}

// ============================================================
// GENERATE
// ============================================================
async function generate() {
  const btn = document.getElementById('btnGenerate');
  const status = document.getElementById('status');

  if (!currentProfile) return;

  const vorname = document.getElementById('vorname').value.trim();
  const nachname = document.getElementById('nachname').value.trim();
  const strasse = document.getElementById('strasse').value.trim();
  const plz = document.getElementById('plz').value.trim();
  const stadt = document.getElementById('stadt').value.trim();
  const stellplatz = document.getElementById('stellplatz').value.trim();
  const datum = document.getElementById('datum').value;

  if (!vorname || !nachname) {
    status.textContent = 'Bitte Vor- und Nachname eingeben.';
    status.className = 'status error';
    return;
  }

  // Ladeeinrichtungen sammeln
  const leRows = document.querySelectorAll('[id^="le-geraet-"]');
  const ladeeinrichtungen = [];
  leRows.forEach(el => {
    const id = el.id.replace('le-geraet-', '');
    const geraet = el.value.trim();
    const serial = document.getElementById(`le-serial-${id}`)?.value.trim() || '';
    if (geraet) ladeeinrichtungen.push({ geraet, serial });
  });

  btn.disabled = true;
  status.textContent = 'Vorlage wird geladen…';
  status.className = 'status';

  try {
    // DOCX laden
    const resp = await fetch(currentProfile.docxUrl);
    if (!resp.ok) throw new Error(`Vorlage nicht erreichbar (${resp.status})`);
    const arrayBuffer = await resp.arrayBuffer();

    status.textContent = 'Platzhalter werden befüllt…';
    const zip = await JSZip.loadAsync(arrayBuffer);
    let xml = await zip.file('word/document.xml').async('string');

    // Datum formatieren
    const datumFormatiert = datum
      ? new Date(datum).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' })
      : '';

    // Ladeeinrichtung 1 (Hauptgerät)
    const le1 = ladeeinrichtungen[0] || {};

    // Platzhalter ersetzen
    const replacements = {
      'VORNAME':        vorname,
      'NACHNAME':       nachname,
      'NAME':           `${vorname} ${nachname}`,
      'STRASSE':        strasse,
      'PLZ':            plz,
      'STADT':          stadt,
      'PLZSTADT':       `${plz} ${stadt}`.trim(),
      'STELLPLATZ':     stellplatz,
      'DATUM':          datumFormatiert,
      'STANDORT':       currentProfile.standortName,
      'STANDORTADRESSE':currentProfile.standortAdresse,
      'GERAET':         le1.geraet || '',
      'SERIENNUMMER':   le1.serial || '',
      'ARTIKEL':        currentProfile.zohoArtikelName,
    };

    for (const [tag, val] of Object.entries(replacements)) {
      xml = replaceTag(xml, tag, val);
    }

    zip.file('word/document.xml', xml);
    const blob = await zip.generateAsync({ type: 'blob' });

    // Download
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `AMBA_Betreibervertrag_${nachname}_${currentProfile.label.replace(/[^a-zA-Z0-9]/g,'_')}.docx`;
    a.click();

    // Webhook
    status.textContent = 'Angebot wird erstellt…';
    const payload = {
      profil: currentProfile.key,
      profil_label: currentProfile.label,
      vorname, nachname,
      strasse, plz, stadt,
      stellplatz,
      datum: datumFormatiert,
      standort: currentProfile.standortName,
      standort_adresse: currentProfile.standortAdresse,
      ladeeinrichtungen,
      zoho_artikel_id: currentProfile.zohoArtikelId,
      zoho_artikel_name: currentProfile.zohoArtikelName,
      zoho_zusatz_id: currentProfile.zusatzId || null,
      zoho_zusatz_name: currentProfile.zusatzName || null,
    };

    await fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    status.textContent = '✓ Vertrag heruntergeladen & Angebot erstellt.';
    status.className = 'status success';
  } catch (err) {
    status.textContent = `Fehler: ${err.message}`;
    status.className = 'status error';
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
