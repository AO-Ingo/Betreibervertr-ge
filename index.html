<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
  <title>AMBA Vertragsgenerator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #232C2B;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      padding: 40px 0 32px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 64px;
    }
    .logo-amba {
      font-size: 36px;
      font-weight: 300;
      letter-spacing: 0.55em;
      color: #fff;
      text-transform: uppercase;
      display: block;
      padding-left: 0.55em;
    }
    .logo-sub {
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.4);
      display: block;
      padding-left: 0.22em;
      margin-top: 4px;
    }
    .hub {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 0 40px 60px;
      width: 100%;
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 24px;
      width: 100%;
      max-width: 860px;
    }
    @media (max-width: 680px) {
      .cards { grid-template-columns: 1fr; }
    }
    .card {
      background: #fff;
      border: 1px solid #E0DDD7;
      border-radius: 20px;
      padding: 48px 32px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: #1A1916;
      transition: box-shadow 0.2s, transform 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .card:hover {
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
      transform: translateY(-4px);
    }
    .card-icon { font-size: 40px; }
    .card-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #6B6660;
    }
    .card-title { font-size: 17px; font-weight: 500; }
    .card-sub { font-size: 12px; color: #6B6660; }
    footer {
      margin-top: auto;
      padding: 24px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <header>
    <span class="logo-amba">A M B A</span>
    <span class="logo-sub">Vertragsgenerator</span>
  </header>
  <div class="hub">
    <div class="cards">
      <a class="card" href="b2b_ac.html">
        <div class="card-icon">⚡</div>
        <div class="card-label">B2B · AC</div>
        <div class="card-title">Betreuungsverträge AC</div>
        <div class="card-sub">Betriebsführung, Vollbetrieb, Wartung</div>
      </a>
      <a class="card" href="b2b_dc.html">
        <div class="card-icon">🔋</div>
        <div class="card-label">B2B · DC</div>
        <div class="card-title">Betreuungsverträge DC</div>
        <div class="card-sub">Technische Betriebsführung DC</div>
      </a>
      <a class="card" href="b2c.html">
        <div class="card-icon">📄</div>
        <div class="card-label">B2C</div>
        <div class="card-title">Betreiberverträge</div>
        <div class="card-sub">LBBW, GSW, Nio und weitere</div>
      </a>
    </div>
  </div>
  <footer>AMBA Vertragsgenerator</footer>
</body>
</html>
