<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
  <title>AMBA Vertragsgenerator</title>
  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #232C2B;
      min-height: 100vh;
    }
    #app {
      display: none;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    #login-page {
      display: none;
      position: fixed;
      inset: 0;
      background: #232C2B;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 9999;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    #login-page button {
      background: #fff;
      color: #232C2B;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    #login-error {
      color: #FCA5A5;
      font-size: 13px;
      max-width: 320px;
    }
    header {
      width: 100%;
      padding: 40px 0 32px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 64px;
    }
    .logo-amba {
      font-size: 36px;
      font-weight: 300;
      letter-spacing: 0.55em;
      color: #fff;
      text-transform: uppercase;
      display: block;
      padding-left: 0.55em;
    }
    .logo-sub {
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.4);
      display: block;
      padding-left: 0.22em;
      margin-top: 4px;
    }
    .hub {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 0 40px 60px;
      width: 100%;
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 24px;
      width: 100%;
      max-width: 860px;
    }
    @media (max-width: 680px) {
      .cards { grid-template-columns: 1fr; }
    }
    .card {
      background: #fff;
      border: 1px solid #E0DDD7;
      border-radius: 20px;
      padding: 48px 32px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: #1A1916;
      transition: box-shadow 0.2s, transform 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .card:hover {
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
      transform: translateY(-4px);
    }
    .card-icon { font-size: 40px; }
    .card-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #6B6660;
    }
    .card-title { font-size: 17px; font-weight: 500; }
    .card-sub { font-size: 12px; color: #6B6660; }
    footer {
      margin-top: auto;
      padding: 24px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div id="login-page">
    <div style="font-size:40px">🔒</div>
    <div style="font-size:20px;font-weight:500;letter-spacing:0.05em">AMBA Vertragsgenerator</div>
    <button onclick="msalLogin()">Mit Microsoft anmelden</button>
    <div id="login-error"></div>
  </div>
  <div id="app">
  <header>
    <span class="logo-amba">A M B A</span>
    <span class="logo-sub">Vertragsgenerator</span>
  </header>
  <div class="hub">
    <div class="cards">
      <a class="card" href="b2b_ac.html">
        <div class="card-icon">⚡</div>
        <div class="card-label">B2B · AC</div>
        <div class="card-title">Betreuungsverträge AC</div>
        <div class="card-sub">Betriebsführung, Vollbetrieb, Wartung</div>
      </a>
      <a class="card" href="b2b_dc.html">
        <div class="card-icon">🔋</div>
        <div class="card-label">B2B · DC</div>
        <div class="card-title">Betreuungsverträge DC</div>
        <div class="card-sub">Technische Betriebsführung DC</div>
      </a>
      <a class="card" href="b2c.html">
        <div class="card-icon">📄</div>
        <div class="card-label">B2C</div>
        <div class="card-title">Betreiberverträge</div>
        <div class="card-sub">LBBW, GSW, Nio und weitere</div>
      </a>
    </div>
  </div>
  <footer>AMBA Vertragsgenerator</footer>
  </div>

  <script>
    const msalConfig = {
      auth: {
        clientId: 'fb059c2f-8b52-4097-a6e9-598d69cc90da',
        authority: 'https://login.microsoftonline.com/a3652b20-644b-4163-8ea8-f0d7f7b76b10',
        redirectUri: window.location.origin + window.location.pathname,
      },
      cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false }
    };

    async function initAuth() {
      const msalInst = new msal.PublicClientApplication(msalConfig);
      await msalInst.initialize();
      window._msalInstance = msalInst;
      try {
        const response = await msalInst.handleRedirectPromise();
        if (response) { showApp(); return; }
      } catch(e) {
        document.getElementById('login-page').style.display = 'flex';
        document.getElementById('login-error').textContent = 'Fehler: ' + e.message;
        return;
      }
      const accounts = msalInst.getAllAccounts();
      if (accounts.length > 0) {
        showApp();
      } else {
        document.getElementById('login-page').style.display = 'flex';
        document.getElementById('app').style.display = 'none';
      }
    }

    window.msalLogin = async function() {
      let w = 0;
      while (!window._msalInstance && w < 50) {
        await new Promise(r => setTimeout(r, 100)); w++;
      }
      if (!window._msalInstance) {
        document.getElementById('login-error').textContent = 'Fehler: Authentifizierung nicht bereit.';
        return;
      }
      try {
        await window._msalInstance.loginRedirect({ scopes: ['User.Read'], prompt: 'select_account' });
      } catch(e) {
        document.getElementById('login-error').textContent = 'Fehler: ' + e.message;
      }
    };

    function showApp() {
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
    }

    initAuth();
  </script>
</body>
</html>
